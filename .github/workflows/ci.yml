name: Matrix CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      # Run every compatibility combination so one failure does not hide other environments.
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
        include:
          - os: ubuntu-latest
            node: 24
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Print environment info for debugging
        run: |
          node --version
          npm --version
          echo "OS: ${{ matrix.os }}"
          echo "Node: ${{ matrix.node }}"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test